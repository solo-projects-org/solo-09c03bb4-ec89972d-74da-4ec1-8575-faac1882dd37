services:
  suppression-check:
    build: .
    image: suppression-check:2.0.0
    container_name: suppression-check
    environment:
      # SQLite 登记库位置；挂载到命名卷以持久化底表/月报/核查版本
      SUPPRESSION_DB_PATH: /data/suppression.db
    volumes:
      - suppression-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  suppression-data:
